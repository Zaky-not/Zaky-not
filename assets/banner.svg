<svg width="1200" height="400"
viewBox="0 0 1200 400"
xmlns="http://www.w3.org/2000/svg">


<!-- SKY BACKGROUND -->

<rect width="1200" height="400" fill="#2563eb"/>

<rect y="200"
width="1200"
height="200"
fill="#1e40af"/>



<!-- PIXEL MOON -->

<g fill="#fde68a">

<rect x="980" y="55" width="70" height="70"/>
<rect x="960" y="75" width="110" height="40"/>

</g>


<g fill="#2563eb">

<rect x="990" y="55" width="35" height="20"/>
<rect x="1005" y="75" width="30" height="20"/>

</g>




<!-- STARS -->

<g fill="white">

<rect x="120" y="60" width="6" height="6"/>
<rect x="220" y="140" width="5" height="5"/>
<rect x="350" y="70" width="6" height="6"/>
<rect x="850" y="100" width="6" height="6"/>
<rect x="760" y="55" width="5" height="5"/>
<rect x="1100" y="160" width="6" height="6"/>


<animate
attributeName="opacity"
values="1;0.4;1"
dur="3s"
repeatCount="indefinite"/>

</g>




<!-- CLOUDS -->

<g fill="#dbeafe">


<g>

<rect x="100" y="110" width="90" height="25"/>
<rect x="140" y="90" width="70" height="45"/>
<rect x="200" y="110" width="80" height="25"/>


<animateTransform
attributeName="transform"
type="translate"
from="-350"
to="1300"
dur="40s"
repeatCount="indefinite"/>

</g>



<g>

<rect x="600" y="150" width="100" height="25"/>
<rect x="650" y="125" width="80" height="45"/>
<rect x="720" y="150" width="90" height="25"/>


<animateTransform
attributeName="transform"
type="translate"
from="-500"
to="1400"
dur="55s"
repeatCount="indefinite"/>

</g>


</g>





<!-- PIXEL MOUNTAINS -->


<polygon
points="0,300 180,160 350,300"
fill="#172554"/>


<polygon
points="200,300 450,120 700,300"
fill="#1e3a8a"/>


<polygon
points="600,300 850,150 1100,300"
fill="#172554"/>



<!-- SNOW -->

<polygon
points="410,150 450,120 490,150"
fill="#dbeafe"/>



<!-- FOREST -->


<g fill="#14532d">

<rect x="80" y="260" width="25" height="90"/>
<polygon points="40,280 95,200 150,280"/>


<rect x="1050" y="270" width="25" height="80"/>
<polygon points="1000,290 1060,200 1120,290"/>


</g>



<!-- GROUND -->


<rect y="350"
width="1200"
height="50"
fill="#166534"/>


<rect y="350"
width="1200"
height="8"
fill="#22c55e"/>




<!-- RPG PANEL -->


<rect
x="260"
y="75"
width="680"
height="245"
fill="#020617"
opacity="0.85"/>


<rect
x="270"
y="85"
width="660"
height="225"
fill="none"
stroke="#ffffff"
stroke-width="3"/>




<!-- NAME -->


<text
x="600"
y="150"
text-anchor="middle"
font-family="monospace"
font-size="42"
font-weight="bold"
fill="white">

Muhammad Albar Al-Zaky

</text>




<!-- DIVIDER -->


<rect
x="400"
y="170"
width="400"
height="3"
fill="#38bdf8"/>




<!-- ROLE -->


<text
x="600"
y="220"
text-anchor="middle"
font-family="monospace"
font-size="24"
fill="#7dd3fc">

&gt; Backend Developer_

</text>




<!-- SKILLS -->


<text
x="600"
y="260"
text-anchor="middle"
font-family="monospace"
font-size="17"
fill="white">

Informatics Student • Cyber Security • Artificial Intelligence

</text>




<!-- MOTTO -->


<text
x="600"
y="295"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="#fde68a">

"Keep Grinding, Just For You."

</text>



</svg>
